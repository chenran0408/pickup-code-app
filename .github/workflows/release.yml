name: Release

# 打 tag（v*）即自动构建并发布 —— 从流程上消灭 v1.0.9 那种
# "tag 指向的提交 ≠ 版本号提交，结果构建出来版本号对不上" 的事故。
#
# 签名：仓库配置下面 4 个 secret 才发布签名包，缺失时只构建 unsigned，不发布：
#   PICKUP_STORE_BASE64     keystore 文件的 base64（`base64 -w0 pickup.keystore`）
#   PICKUP_STORE_PASSWORD   storePassword
#   PICKUP_KEY_ALIAS        keyAlias
#   PICKUP_KEY_PASSWORD     keyPassword
#
# 注意：tag 必须打在**版本号 bump 的提交**上（见 app/build.gradle.kts 的注释）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # 支持手动试跑（试跑时不会发布，只构建与校验）

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'

      - name: Install Android preview platform
        run: sdkmanager --channel=3 --install "platforms;android-37.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.PICKUP_STORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "已配置签名密钥，将产出**签名包**"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning::未配置签名密钥（PICKUP_STORE_BASE64），本次只出**未签名包**，不会发布 Release"
          fi

      - name: Lint
        run: ./gradlew :app:lintGeneralDebug :app:lintMiRootDebug --no-daemon --max-workers=1 --console=plain

      - name: Check SQLite migrations
        run: python3 docs/tools/check-migration.py

      - name: Run unit tests
        run: ./gradlew :app:testGeneralDebugUnitTest :app:testMiRootDebugUnitTest --console=plain

      - name: Build release APKs
        run: ./gradlew :app:assembleGeneralRelease :app:assembleMiRootRelease --console=plain

      # 两种包使用同一正式密钥签名；未配置密钥时只归档 unsigned 构建产物。
      - name: Prepare release APKs
        env:
          PICKUP_STORE_PASSWORD: ${{ secrets.PICKUP_STORE_PASSWORD }}
          PICKUP_KEY_ALIAS: ${{ secrets.PICKUP_KEY_ALIAS }}
          PICKUP_KEY_PASSWORD: ${{ secrets.PICKUP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OUT="$GITHUB_WORKSPACE/app/build/outputs/release-assets"
          mkdir -p "$OUT"
          if [ "$SIGNED" = "1" ]; then
            test -s "$GITHUB_WORKSPACE/release.keystore"
            test -n "$PICKUP_STORE_PASSWORD"
            test -n "$PICKUP_KEY_ALIAS"
            test -n "$PICKUP_KEY_PASSWORD"
            "$APKSIGNER" sign --ks "$GITHUB_WORKSPACE/release.keystore" \
              --ks-key-alias "$PICKUP_KEY_ALIAS" \
              --ks-pass env:PICKUP_STORE_PASSWORD --key-pass env:PICKUP_KEY_PASSWORD \
              --out "$OUT/app-arm64-v8a-release.apk" \
              app/build/outputs/apk/general/release/app-general-arm64-v8a-release-unsigned.apk
            "$APKSIGNER" sign --ks "$GITHUB_WORKSPACE/release.keystore" \
              --ks-key-alias "$PICKUP_KEY_ALIAS" \
              --ks-pass env:PICKUP_STORE_PASSWORD --key-pass env:PICKUP_KEY_PASSWORD \
              --out "$OUT/app-arm64-v8a-miroot-release.apk" \
              app/build/outputs/apk/miRoot/release/app-miRoot-arm64-v8a-release-unsigned.apk
            echo "APK_GENERAL=$OUT/app-arm64-v8a-release.apk" >> "$GITHUB_ENV"
            echo "APK_MIROOT=$OUT/app-arm64-v8a-miroot-release.apk" >> "$GITHUB_ENV"
          else
            cp app/build/outputs/apk/general/release/app-general-arm64-v8a-release-unsigned.apk "$OUT/app-arm64-v8a-release-unsigned.apk"
            cp app/build/outputs/apk/miRoot/release/app-miRoot-arm64-v8a-release-unsigned.apk "$OUT/app-arm64-v8a-miroot-release-unsigned.apk"
            echo "APK_GENERAL=$OUT/app-arm64-v8a-release-unsigned.apk" >> "$GITHUB_ENV"
            echo "APK_MIROOT=$OUT/app-arm64-v8a-miroot-release-unsigned.apk" >> "$GITHUB_ENV"
          fi

      # 两个包都必须匹配 tag 和预期 applicationId。
      - name: Verify both APK versions and package IDs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -x
          TAG="${GITHUB_REF_NAME#v}"
          AAPT2=$(command -v aapt2 || ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then echo "::error::找不到 aapt2"; ls "${ANDROID_HOME:-}/build-tools" || true; exit 1; fi
          verify_apk() {
            APK_PATH="$1"
            EXPECTED_PACKAGE="$2"
            EXPECTED_MIN_SDK="$3"
            EXPECTED_TARGET_SDK="$4"
            test -s "$APK_PATH"
            BADGING=$("$AAPT2" dump badging "$APK_PATH")
            PACKAGE=$(echo "$BADGING" | sed -n "s/package: name='\([^']*\)'.*/\1/p")
            MIN_SDK=$(echo "$BADGING" | sed -n "s/minSdkVersion:'\([^']*\)'.*/\1/p")
            TARGET_SDK=$(echo "$BADGING" | sed -n "s/targetSdkVersion:'\([^']*\)'.*/\1/p")
            VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
            echo "tag=$TAG apk=$APK_PATH package=$PACKAGE minSdk=$MIN_SDK targetSdk=$TARGET_SDK versionName=$VERSION_NAME versionCode=$VERSION_CODE"
            test "$PACKAGE" = "$EXPECTED_PACKAGE"
            test "$MIN_SDK" = "$EXPECTED_MIN_SDK"
            test "$TARGET_SDK" = "$EXPECTED_TARGET_SDK"
            if [ "$TAG" != "$VERSION_NAME" ]; then
              echo "::error::tag($TAG) 与 APK versionName($VERSION_NAME) 不一致"
              exit 1
            fi
          }
          verify_apk "$APK_GENERAL" "com.pickupcode.app" "26" "35"
          verify_apk "$APK_MIROOT" "com.pickupcode.app.miroot" "36" "36"

      # 校验签名（有密钥时）
      - name: Verify signature
        run: |
          APKSIGNER=$(command -v apksigner || ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ "$SIGNED" = "1" ]; then
            "$APKSIGNER" verify --print-certs "$APK_GENERAL"
            "$APKSIGNER" verify --print-certs "$APK_MIROOT"
          else
            echo "未配置密钥，跳过签名校验（产物为 unsigned）"
          fi

      - name: Compute SHA-256 for both APKs
        run: |
          (cd app/build/outputs/release-assets && sha256sum "$(basename "$APK_GENERAL")" "$(basename "$APK_MIROOT")") | tee "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          {
            echo "## 产物校验"
            echo '```'
            cat "$GITHUB_WORKSPACE/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve general R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.ref_name }}-general
          path: app/build/outputs/mapping/generalRelease/mapping.txt
          retention-days: 90

      - name: Preserve MI-root R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.ref_name }}-miroot
          path: app/build/outputs/mapping/miRootRelease/mapping.txt
          retention-days: 90

      # 只有签名包才发布：未签名 APK 根本无法安装，发出去只会误导用户。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_GENERAL }}
            ${{ env.APK_MIROOT }}
            SHA256SUMS.txt
          body_path: docs/RELEASE_NOTES.md
          fail_on_unmatched_files: true

      - name: Skip notice
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED != '1'
        run: |
          echo "::warning::未配置签名密钥，已跳过 Release 发布（未签名 APK 无法安装）。"
          echo "把 keystore 以 base64 存入 secret PICKUP_STORE_BASE64，并配 PICKUP_STORE_PASSWORD / PICKUP_KEY_ALIAS / PICKUP_KEY_PASSWORD 即可自动发布签名包。" >> "$GITHUB_STEP_SUMMARY"
